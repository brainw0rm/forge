# Reads the WoW news sites' public RSS/Atom feeds and sends the headlines about WoW Forever to
# the site (headline, link, publisher, date only; see shared/news.ts). Parsing happens here,
# not in the Pages Function, so the site stays within the Workers CPU limits.
# Needs repository secrets SITE_URL (e.g. https://wow-forever-forge.com) and NOTIFY_SECRET
# (the same value as the Pages project's NOTIFY_SECRET).
name: Refresh news

on:
  schedule:
    # Every 2 hours: keeps a private repository within the free 2,000 Actions minutes a month.
    - cron: "41 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news:
    runs-on: ubuntu-latest
    if: ${{ vars.NEWS_DISABLED != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch feeds and upload headlines
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$NOTIFY_SECRET" ]; then echo "SITE_URL/NOTIFY_SECRET not set; skipping"; exit 0; fi
          node scripts/fetch-news.ts
