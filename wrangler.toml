# Cloudflare Pages project: static site in dist/ + API in functions/ backed by D1.
name = "forever-forge"
compatibility_date = "2026-09-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "forever-forge"
# Production database (created 2026-10-01, region EEUR). Local development ignores the id and
# uses a SQLite file under .wrangler/.
database_id = "24529dc0-19eb-48d7-a2e2-8e4078358176"
migrations_dir = "migrations"
